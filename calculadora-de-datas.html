<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Datas</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    font-family: 'Roboto', sans-serif;
}

body {
    background-color: #0b1320;
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 80px 16px 16px;
    color: #fff;
}

/* Botão topo centralizado */
.top-actions {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
}

.top-actions a {
    background: #0a58ca;
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 500;
    font-size: 14px;
    transition: 0.3s;
}

.top-actions a:hover {
    background: #084298;
}

/* Card */
.container {
    background: #111a2e;
    padding: 26px;
    width: 100%;
    max-width: 420px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}

h2 {
    text-align: center;
    margin-bottom: 22px;
    color: #4da3ff;
    font-size: 24px;
    font-weight: 700;
}

/* Labels */
.label {
    font-size: 14px;
    margin-bottom: 6px;
    display: block;
    color: #e5e7eb;
}

/* Inputs */
input, select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #1e2a44;
    font-size: 15px;
    margin-bottom: 16px;
    background: #0f172a;
    color: #ffffff;
}

input:focus, select:focus {
    outline: 2px solid #0a58ca;
}

/* Resultado */
.resultado {
    margin-top: 14px;
    padding: 18px 16px 14px;
    background: #0f172a;
    border: 2px solid #0a58ca;
    border-radius: 16px;
    text-align: center;
    cursor: pointer;
}

.resultado-data {
    font-family: 'Roboto Mono', monospace;
    font-weight: 700;
    font-size: 30px;
    color: #ffffff;
}

.resultado-metricas {
    margin-top: 6px;
    font-size: 11px;
    font-weight: 500;
    color: #9ca3af;
}

/* Calendário oculto */
#calendarHidden {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="top-actions">
    <a href="#">Ver mais ferramentas</a>
</div>

<div class="container">
    <h2>📅 Calculadora de Datas</h2>

    <label class="label">Data inicial</label>
    <input type="date" id="dataInicial">

    <label class="label">Quantidade de dias</label>
    <input type="number" id="quantidadeDias" min="0" placeholder="Ex: 10">

    <label class="label">Tipo de contagem</label>
    <select id="tipoDias">
        <option value="corridos">Dias corridos</option>
        <option value="uteis">Dias úteis</option>
    </select>

    <div class="resultado" id="resultado">
        <div class="resultado-data" id="resultadoData">
            
        </div>
        <div class="resultado-metricas" id="resultadoMetricas"></div>
    </div>

    <input type="date" id="calendarHidden">
</div>

<script>
const dataInicialInput = document.getElementById("dataInicial");
const quantidadeDiasInput = document.getElementById("quantidadeDias");
const tipoDiasSelect = document.getElementById("tipoDias");
const resultadoData = document.getElementById("resultadoData");
const resultadoMetricas = document.getElementById("resultadoMetricas");
const calendarHidden = document.getElementById("calendarHidden");

let dataFinalISO = null;

// Data atual sem bug de fuso
dataInicialInput.value = new Date().toISOString().split("T")[0];

function toISO(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
}

function calcularDataFinal() {
    const qtd = parseInt(quantidadeDiasInput.value);
    if (isNaN(qtd)) {
        resultadoData.textContent = "Informe a quantidade de dias";
        resultadoMetricas.textContent = "";
        dataFinalISO = null;
        return;
    }

    let data = new Date(dataInicialInput.value + "T00:00:00");

    if (tipoDiasSelect.value === "corridos") {
        data.setDate(data.getDate() + qtd);
    } else {
        let adicionados = 0;
        while (adicionados < qtd) {
            data.setDate(data.getDate() + 1);
            const dia = data.getDay();
            if (dia !== 0 && dia !== 6) adicionados++;
        }
    }

    dataFinalISO = toISO(data);

    const diffMs = data - new Date(dataInicialInput.value + "T00:00:00");
    const diffDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));

    const semanas = (diffDias / 7).toFixed(1);
    const meses = (diffDias / 30.44).toFixed(1);
    const anos = (diffDias / 365.25).toFixed(2);

    resultadoData.textContent = " " + data.toLocaleDateString("pt-BR");
    resultadoMetricas.textContent =
        `${semanas} semanas • ${meses} meses • ${anos} anos`;

    calendarHidden.value = dataFinalISO;
}

// Abrir calendário ao clicar no resultado
document.getElementById("resultado").addEventListener("click", () => {
    if (!dataFinalISO) return;
    calendarHidden.showPicker
        ? calendarHidden.showPicker()
        : calendarHidden.focus();
});

// Atualização automática
[dataInicialInput, quantidadeDiasInput, tipoDiasSelect].forEach(el => {
    el.addEventListener("input", calcularDataFinal);
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gerador de Código de Barras</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* { box-sizing: border-box; font-family: 'Roboto', sans-serif; }

body {
    background-color: #0b1320;
    color: #fff;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 80px 16px 16px;
}

/* Botão topo */
.top-actions {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
}

.top-actions a {
    background: #0a58ca;
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 500;
    font-size: 14px;
    transition: 0.3s;
}

.top-actions a:hover {
    background: #084298;
}

/* Container */
.container {
    background: #111a2e;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    max-width: 420px;
    width: 100%;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #4da3ff;
}

/* Labels */
label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    margin-bottom: 5px;
    color: #e5e7eb;
}

label i {
    color: #4da3ff;
}

/* Input */
input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #1e2a44;
    background: #0f172a;
    color: #fff;
    font-size: 16px;
    margin-bottom: 6px;
}

input.error {
    border-color: #ff4d4d;
}

.error-message {
    font-size: 12px;
    color: #ff4d4d;
    margin-bottom: 12px;
    display: none;
}

/* Botão */
button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #0a58ca;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
}

button:hover {
    background: #084298;
}

/* Spinner */
.spinner {
    border: 6px solid #0f172a;
    border-top: 6px solid #0a58ca;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    animation: spin 1s linear infinite;
    margin: 20px auto;
    display: none;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* Preview */
#preview-wrapper {
    margin-top: 20px;
    padding: 15px;
    border-radius: 16px;
    border: 2px solid #0a58ca;
    background: #0f172a;
    text-align: center;
    display: none;
}

.preview-box {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
}

.download-btn {
    margin-top: 15px;
    padding: 10px 20px;
    background: #0a58ca;
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}

.download-btn:hover {
    background: #084298;
}
</style>
</head>
<body>

<div class="top-actions">
    <a href="/"><i class="fas fa-toolbox"></i> Ver mais ferramentas</a>
</div>

<div class="container">
    <h1><i class="fas fa-barcode"></i> Gerador de Código de Barras</h1>

    <label for="barcode-text">
        <i class="fas fa-keyboard"></i> Conteúdo do código
    </label>
    <input type="text" id="barcode-text" placeholder="Digite algo para gerar">
    <div class="error-message" id="error-barcode">Campo obrigatório</div>

    <button onclick="gerarCodigo()">
        <i class="fas fa-barcode"></i> Gerar Código
    </button>

    <div id="spinner" class="spinner"></div>

    <div id="preview-wrapper">
        <div class="preview-box">
            <svg id="barcode"></svg>
        </div>
        <button class="download-btn" onclick="baixarCodigo()">
            <i class="fas fa-download"></i> Download SVG
        </button>
    </div>
</div>

<script>
function gerarCodigo() {
    const input = document.getElementById('barcode-text');
    const error = document.getElementById('error-barcode');
    const svg = document.getElementById('barcode');
    const preview = document.getElementById('preview-wrapper');
    const spinner = document.getElementById('spinner');

    error.style.display = 'none';
    input.classList.remove('error');
    svg.innerHTML = '';
    preview.style.display = 'none';

    if (!input.value.trim()) {
        error.style.display = 'block';
        input.classList.add('error');
        return;
    }

    spinner.style.display = 'block';

    setTimeout(() => {
        spinner.style.display = 'none';

        JsBarcode(svg, input.value.trim(), {
            format: "CODE128",
            lineColor: "#ffffff",
            background: "transparent",
            width: 2,
            height: 90,
            displayValue: true,
            fontOptions: "bold",
            fontSize: 16
        });

        preview.style.display = 'block';
    }, 1500);
}

function baixarCodigo() {
    const svg = document.querySelector('#barcode');
    const serializer = new XMLSerializer();
    const svgBlob = new Blob(
        [serializer.serializeToString(svg)],
        { type: "image/svg+xml" }
    );
    const url = URL.createObjectURL(svgBlob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "codigo_de_barras.svg";
    link.click();
    URL.revokeObjectURL(url);
}
</script>

</body>
    </html>
